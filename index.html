<title>LFD Services — Questionnaire de fonctionnement</title>
<style>
  :root {
    --ink: #1c2420;
    --forest: #1e3d32;
    --leaf: #2c6b4a;
    --cream: #f3eee4;
    --paper: #fffdf9;
    --line: #e4d9c8;
    --clay: #a65332;
    --muted: #5d675f;
    --soft: #e7f2eb;
    --warn: #8a3d22;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 400px at 10% -10%, #e7f0e4 0%, transparent 50%),
      var(--cream);
    line-height: 1.45;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: rgba(255, 253, 249, 0.92);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; gap: 12px; align-items: center; }
  .mark {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--forest); color: #f3eee4;
    display: grid; place-items: center; font-family: Georgia, serif; font-weight: 700;
  }
  .brand b { display: block; font-family: Georgia, "Palatino Linotype", serif; font-size: 18px; letter-spacing: 0.01em; }
  .brand span { color: var(--muted); font-size: 12px; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .langs button {
    border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--muted);
  }
  .langs button.on { background: var(--forest); color: white; }
  main { max-width: 980px; margin: 0 auto; padding: 22px 16px 64px; display: grid; grid-template-columns: 230px 1fr; gap: 18px; }
  nav {
    position: sticky; top: 78px; align-self: start;
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px;
  }
  nav button {
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 13px;
  }
  nav button.on { background: var(--soft); color: var(--forest); font-weight: 650; }
  nav button small { display: block; color: var(--muted); font-weight: 500; }
  article {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 26px 22px 20px; box-shadow: 0 10px 30px rgba(30, 61, 50, 0.04);
  }
  .kicker { color: var(--leaf); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 6px; }
  h1, h2 { font-family: Georgia, "Palatino Linotype", serif; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  h1 { font-size: 34px; line-height: 1.15; }
  h2 { font-size: 28px; }
  .lead { color: #3e4943; margin: 0 0 18px; }
  .note, .banner {
    background: #f7f3ea; border-left: 3px solid var(--leaf); padding: 10px 12px; border-radius: 8px; margin: 0 0 16px; color: #314038;
  }
  .warn { background: #fbf1ec; border-left-color: var(--clay); }
  fieldset { border: 0; margin: 0 0 16px; padding: 0; }
  legend, .qlabel { font-weight: 650; display: block; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .req { color: var(--clay); }
  .choices { display: grid; gap: 8px; }
  .choice {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: white; cursor: pointer;
  }
  .choice:has(input:checked) { border-color: var(--leaf); background: var(--soft); }
  .choice input { margin-top: 3px; }
  input[type="text"], input[type="email"], input[type="tel"], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; background: white;
  }
  textarea { min-height: 110px; resize: vertical; }
  .compact { margin-bottom: 10px; }
  .compact .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .skip {
    display: flex; gap: 8px; align-items: center; margin: 0 0 14px; color: var(--muted);
  }
  .error { color: var(--warn); font-size: 13px; margin-top: 6px; }
  .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
  button.btn {
    border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--forest); color: white; }
  button.ghost { background: transparent; color: var(--forest); }
  button.btn:disabled { opacity: 0.55; cursor: wait; }
  .review section { border-top: 1px solid var(--line); padding: 12px 0; }
  .review h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .review p { margin: 4px 0; }
  .review b { font-weight: 650; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; margin: 12px 0 18px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--leaf); }
  footer { max-width: 980px; margin: -40px auto 30px; padding: 0 16px 0 262px; color: var(--muted); font-size: 12px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    nav { position: static; display: flex; gap: 6px; overflow: auto; }
    nav button { width: auto; white-space: nowrap; }
    nav button small { display: none; }
    footer { padding-left: 16px; }
    h1 { font-size: 28px; }
    .compact .choices { grid-template-columns: 1fr; }
  }
</style>
</head>

const state = load();
const stage = document.getElementById("stage");
const nav = document.getElementById("nav");

document.getElementById("lang-fr").onclick = () => setLang("fr");
document.getElementById("lang-en").onclick = () => setLang("en");

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem("lfd-q-v1") || "null");
    if (saved && saved.version === VERSION) return saved;
  } catch (e) {}
  return { version: VERSION, lang: "fr", screen: "start", answers: {}, consent: false, startedAt: Date.now() };
}
function save() {
  localStorage.setItem("lfd-q-v1", JSON.stringify(state));
}
function setLang(lang) {
  state.lang = lang;
  save();
  render();
}
function t() { return T[state.lang]; }
function tx(bag) { return bag[state.lang] || bag.fr; }
function visible(question) {
  const rule = question.showIf;
  if (!rule) return true;
  const value = state.answers[rule.id];
  if (rule.equals != null) return value === rule.equals;
  if (rule.includes) return Array.isArray(value) && value.includes(rule.includes);
  if (rule.equalsAny) return rule.equalsAny.includes(value);
  return true;
}
function skipped(section) {
  return !!state.answers["skip_" + section.id];
}
function optionLabel(question, value, lang) {
  const found = (question.options || []).find(item => item.value === value);
  if (!found) return value || "";
  return found[lang] || found.fr;
}
function answerText(question, lang) {
  const value = state.answers[question.id];
  if (value == null || value === "" || (Array.isArray(value) && value.length === 0)) return "";
  if (Array.isArray(value)) return value.map(item => optionLabel(question, item, lang)).join(" ; ");
  if (question.options) return optionLabel(question, value, lang);
  return String(value);
}
function sectionError(section) {
  if (skipped(section)) return null;
  for (const question of section.questions) {
    if (!question.required || !visible(question)) continue;
    const value = state.answers[question.id];
    const missing = question.type === "multi" ? !value || value.length === 0 : !String(value || "").trim();
    if (missing) return question.id;
  }
  return null;
}

function render(scroll) {
  document.documentElement.lang = state.lang;
  document.getElementById("tagline").textContent = t().tagline;
  document.getElementById("foot").textContent = t().foot;
  document.getElementById("lang-fr").classList.toggle("on", state.lang === "fr");
  document.getElementById("lang-en").classList.toggle("on", state.lang === "en");
  renderNav();
  stage.innerHTML = "";
  if (state.screen === "start") renderStart();
  else if (state.screen === "review") renderReview();
  else if (state.screen === "thanks") renderThanks();
  else renderSection(SECTIONS[state.screen]);
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
function renderNav() {
  nav.innerHTML = "";
  const items = [{ id: "start", label: state.lang === "fr" ? "Introduction" : "Introduction" }]
    .concat(SECTIONS.map((section, index) => ({ id: index, label: tx(section).title })))
    .concat([{ id: "review", label: state.lang === "fr" ? "Envoi" : "Send" }]);
  items.forEach(item => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.label;
    const current = (item.id === "start" && state.screen === "start")
      || (item.id === "review" && (state.screen === "review" || state.screen === "thanks"))
      || item.id === state.screen;
    button.classList.toggle("on", current);
    button.onclick = () => {
      if (item.id === "start") state.screen = "start";
      else if (item.id === "review") state.screen = "review";
      else state.screen = item.id;
      save();
      render();
    };
    nav.appendChild(button);
  });
}

}
function renderSection(section) {
  const copy = t();
  const index = SECTIONS.indexOf(section);
  stage.appendChild(p("kicker", copy.step + " " + (index + 1) + " " + copy.of + " " + SECTIONS.length));
  const bar = document.createElement("div");
  bar.className = "progress";
  const fill = document.createElement("span");
  fill.style.width = ((index + 1) / SECTIONS.length * 100) + "%";
  bar.appendChild(fill);
  stage.appendChild(bar);
  stage.appendChild(h("h2", tx(section).title));
  stage.appendChild(p("lead", tx(section).lead));
  if (section.canSkip) {
    const label = document.createElement("label");
    label.className = "skip";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = skipped(section);
    input.onchange = () => {
      state.answers["skip_" + section.id] = input.checked;
      save();
      render();
    };
    label.appendChild(input);
    label.appendChild(document.createTextNode(copy.skip));
    stage.appendChild(label);
  }
  const wrap = document.createElement("div");
  wrap.className = "questions" + (skipped(section) ? " is-skipped" : "");
  if (skipped(section)) wrap.style.opacity = "0.45";
  section.questions.forEach(question => {
    if (!visible(question)) return;
    wrap.appendChild(renderQuestion(question));
  });
  stage.appendChild(wrap);
  const error = document.createElement("div");
  error.className = "error";
  error.id = "form-error";
  if (state.pendingError) {
    error.textContent = copy.required;
    const missingId = state.pendingError;
    state.pendingError = null;
    setTimeout(() => {
      const node = document.getElementById("q-" + missingId);
      if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 0);
  }
  stage.appendChild(error);
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(button(copy.back, "ghost", () => go(index === 0 ? "start" : index - 1)));
  row.appendChild(button(index === SECTIONS.length - 1 ? copy.review : copy.next, "primary", () => {
    const missing = sectionError(section);
    if (missing) {
      error.textContent = copy.required;
      const node = document.getElementById("q-" + missing);
      if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    go(index === SECTIONS.length - 1 ? "review" : index + 1);
  }));
  stage.appendChild(row);
}
function renderQuestion(question) {
  const box = document.createElement("fieldset");
  box.id = "q-" + question.id;
  if (question.compact) box.classList.add("compact");
  const legend = document.createElement("legend");
  legend.className = "qlabel";
  legend.textContent = tx(question).label;
  if (question.required) {
    const star = document.createElement("span");
    star.className = "req";
    star.textContent = " *";
    legend.appendChild(star);
  }
  box.appendChild(legend);
  if (tx(question).hint) box.appendChild(p("hint", tx(question).hint));
  const value = state.answers[question.id];
  if (question.type === "single" || question.type === "multi") {
    const choices = document.createElement("div");
    choices.className = "choices";
    question.options.forEach(option => {
      const label = document.createElement("label");
      label.className = "choice";
      const input = document.createElement("input");
      input.type = question.type === "multi" ? "checkbox" : "radio";
      input.name = question.id;
      input.value = option.value;
      input.checked = question.type === "multi" ? Array.isArray(value) && value.includes(option.value) : value === option.value;
      input.onchange = () => {
        if (question.type === "multi") {
          const current = new Set(state.answers[question.id] || []);
          if (input.checked) current.add(option.value); else current.delete(option.value);
          state.answers[question.id] = Array.from(current);
        } else state.answers[question.id] = option.value;
        save();
        render();
      };
      label.appendChild(input);
      label.appendChild(document.createTextNode(option[state.lang]));
      choices.appendChild(label);
    });
    box.appendChild(choices);
  } else {
    const field = question.type === "long" ? document.createElement("textarea") : document.createElement("input");
    if (question.type !== "long") field.type = question.type === "email" ? "email" : question.type === "tel" ? "tel" : "text";
    field.value = value || "";
    field.oninput = () => { state.answers[question.id] = field.value; save(); };
    box.appendChild(field);
  }
  return box;
}
function renderReview() {
  const copy = t();
  stage.appendChild(p("kicker", copy.review));
  stage.appendChild(h("h2", copy.review));
  const review = document.createElement("div");
  review.className = "review";
  SECTIONS.forEach((section, index) => {
    const block = document.createElement("section");
    const heading = document.createElement("h3");
    heading.appendChild(document.createTextNode(tx(section).title));
    const edit = button(copy.edit, "ghost", () => go(index));
    heading.appendChild(edit);
    block.appendChild(heading);
    if (skipped(section)) block.appendChild(p("", copy.skipped));
    else section.questions.forEach(question => {
      if (!visible(question)) return;
      const line = document.createElement("p");
      const name = document.createElement("b");
      name.textContent = tx(question).label + " : ";
      line.appendChild(name);
      line.appendChild(document.createTextNode(answerText(question, state.lang) || copy.empty));
      block.appendChild(line);
    });
    review.appendChild(block);
  });
  stage.appendChild(review);
  const consent = document.createElement("label");
  consent.className = "choice";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = state.consent;
  box.onchange = () => { state.consent = box.checked; save(); };
  consent.appendChild(box);
  consent.appendChild(document.createTextNode(copy.consent));
  stage.appendChild(consent);
  const error = document.createElement("div");
  error.className = "error";
  error.id = "form-error";
  stage.appendChild(error);
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(button(copy.back, "ghost", () => go(SECTIONS.length - 1)));
  const send = button(copy.send, "primary", () => submit(send, error));
  row.appendChild(send);
  stage.appendChild(row);
  const tools = document.createElement("div");

  tools.appendChild(button(copy.copy, "ghost", () => copySummary(tools)));
  stage.appendChild(tools);
}

  stage.appendChild(h("h2", copy.thanksTitle));
  stage.appendChild(p("lead", copy.thanks));
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(button(copy.download, "ghost", download));
  row.appendChild(button(copy.copy, "ghost", () => copySummary(row)));
  stage.appendChild(row);
}
function go(screen) {
  state.screen = screen;
  save();
  render(true);
}
function reset() {
  state.answers = {};
  state.consent = false;
  state.startedAt = Date.now();
  state.screen = 0;
  save();
  render();
}
function button(label, kind, onClick) {
  const node = document.createElement("button");
  node.type = "button";
  node.className = "btn " + kind;
  node.textContent = label;
  node.onclick = onClick;
  return node;
}
function h(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
function p(className, text) {
  const node = document.createElement("p");
  if (className) node.className = className;
  node.textContent = text;
  return node;
}
function summary() {
  const lines = [
    "LFD Services — questionnaire de fonctionnement",
    "Version " + VERSION,
    "Langue de saisie : " + state.lang,
    "Envoyé : " + new Date().toISOString(),
    ""
  ];
  SECTIONS.forEach(section => {
    lines.push("## " + section.fr.title);
    if (skipped(section)) lines.push("Partie passée");
    else section.questions.forEach(question => {
      if (!visible(question)) return;
      lines.push(question.fr.label + " : " + (answerText(question, "fr") || "—"));
    });
    lines.push("");
  });
  return lines.join("\n");
}
function download() {
  const blob = new Blob([summary()], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "lfd-questionnaire.txt";
  link.click();
  URL.revokeObjectURL(link.href);
}
function copySummary(host) {
  navigator.clipboard.writeText(summary()).then(() => {
    const note = document.createElement("p");
    note.className = "hint";
    note.textContent = t().copied;
    host.after(note);
  });
}
async function submit(send, error) {
  const copy = t();
  if (!state.consent) {
    error.textContent = copy.consentNeed;
    return;
  }
  for (let index = 0; index < SECTIONS.length; index++) {
    const missing = sectionError(SECTIONS[index]);
    if (missing) {
      state.pendingError = missing;
      state.screen = index;
      save();
      render(true);
      return;
    }
  }
  send.disabled = true;
  send.textContent = copy.sending;
  const payload = {
    _subject: "LFD Services — questionnaire de fonctionnement",
    _template: "table",
    _captcha: "false",
    name: state.answers.name || "",
    role: state.answers.role || "",
    email: state.answers.email || "",
    whatsapp: state.answers.phone || "",
    message: summary()
  };
  try {
    const response = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    const message = (data.message || "") + " " + (data.success || "");
    if (!response.ok || /activation|confirm/i.test(message) || data.success === "false" || data.success === false) {
      throw new Error(message || "send failed");
    }
    state.screen = "thanks";
    save();
    render();
  } catch (err) {
    send.disabled = false;
    send.textContent = copy.send;
    error.textContent = copy.fail;
    const fallback = button(copy.fallback, "primary", classicSubmit);
    error.after(fallback);
  }
}
function classicSubmit() {
  const form = document.createElement("form");
  form.method = "POST";
  form.action = CLASSIC;
  form.target = "_blank";
  const fields = {
    _subject: "LFD Services — questionnaire de fonctionnement",
    _captcha: "false",
    _template: "table",
    name: state.answers.name || "",
    role: state.answers.role || "",
    email: state.answers.email || "",
    whatsapp: state.answers.phone || "",
    message: summary()
  };
  Object.entries(fields).forEach(([key, value]) => {
    const input = document.createElement("textarea");
    input.name = key;
    input.value = value;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  form.remove();
}

render();
</script>
</body>
